# KitchenSync — Full Stack (Simulator + Dashboard)
#
# Both services share the same image build.
# Environment variables are loaded from .env (see .env.example).
#
# Both services read/write Neon only — Snowflake is retired from the
# live/nightly path entirely (2026-08).
#
# There is no ingest API service (2026-08) — the simulator writes
# directly to Neon in short-lived, batched connections instead of
# POSTing to a FastAPI service. See Dockerfile for why.
#
# ML pipeline (build_baseline_profile → A/B) is not included here —
# it runs as a nightly cron job on EC2.
#
# Usage:
#   docker compose up --build
#   docker compose up dashboard    # dashboard only
#   docker compose logs -f simulator

services:
  simulator:
    build: .
    command: uv run python -m simulator.pos_simulator
    env_file: .env
    environment:
      - PYTHONPATH=.

  dashboard:
    build: .
    command: uv run streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    env_file: .env
    environment:
      - PYTHONPATH=.
